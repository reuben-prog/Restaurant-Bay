<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay Bellerive has moved &mdash; baybellerive.com.au</title>
<meta name="description" content="Bay Bellerive bar &amp; restaurant has a new website: baybellerive.com.au">
<link rel="canonical" href="https://baybellerive.com.au/">
<meta name="robots" content="noindex, follow">

<!-- Fallback redirect for browsers without JavaScript -->
<meta http-equiv="refresh" content="8; url=https://baybellerive.com.au/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  /* Subset of the Bay Bellerive site stylesheet, inlined so this page
     works as a standalone drop-in on the old domain. */
  :root {
      --bg-color: #3e2723;              /* Chocolate brown */
      --text-color: #fdf5e6;            /* Warm cream/beige */
      --font-family-body: 'Inter', sans-serif;
      --font-family-heading: 'Cormorant Garamond', serif;
      --transition-speed: 0.3s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family-body);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
  }

  a { color: var(--text-color); text-decoration: none; position: relative; }

  h1, h2, .logo {
      font-family: var(--font-family-heading);
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
  }

  .logo {
      font-size: 2rem;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
  }

  h2 { font-size: 3.5rem; line-height: 1.2; }

  p {
      margin-bottom: 2rem;
      font-size: 1.15rem;
      font-weight: 300;
      color: rgba(253, 245, 230, 0.9);
  }

  .centered-section {
      padding: 6rem 2rem;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
  }

  .new-site {
      font-family: var(--font-family-heading);
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      display: inline-block;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(253, 245, 230, 0.4);
      padding-bottom: 0.2rem;
      transition: border-color var(--transition-speed) ease;
  }

  .new-site:hover { border-bottom-color: var(--text-color); }

  .btn {
      display: inline-block;
      padding: 1rem 3rem;
      border: 1px solid var(--text-color);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.85rem;
      transition: all var(--transition-speed) ease;
      margin-top: 2rem;
      font-family: var(--font-family-body);
  }

  .btn:hover, .btn:focus {
      background-color: var(--text-color);
      color: var(--bg-color);
  }

  .footer {
      padding: 3rem 2rem 4rem;
      text-align: center;
      position: relative;
  }

  .footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 1px;
      background-color: rgba(253, 245, 230, 0.3);
  }

  .footer p {
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      margin-bottom: 0;
      opacity: 0.8;
  }

  /* Animations */
  .fade-in { opacity: 0; animation: fadeIn 1.5s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 900px) {
      h2 { font-size: 2.5rem; }
      .centered-section { padding: 4rem 1.5rem; }
      .logo { font-size: 1.6rem; margin-bottom: 0.8rem; }
      .new-site { font-size: 1.3rem; }
      .btn { padding: 1rem 1.5rem; width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
      .fade-in { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <main class="centered-section fade-in">
    <div class="logo">Bay Bellerive</div>
    <h2>We&rsquo;ve moved to a new website</h2>
    <p>Bay Bellerive bar &amp; restaurant can now be found at</p>
    <a class="new-site" href="https://baybellerive.com.au/">baybellerive.com.au</a>
    <br>
    <a class="btn" href="https://baybellerive.com.au/">Visit our new site</a>
  </main>

  <footer class="footer">
    <p>You&rsquo;ll be redirected automatically in <span id="countdown">8</span> seconds &mdash; please update your bookmarks.</p>
  </footer>

<script>
  (function () {
    var target = "https://baybellerive.com.au/";
    var seconds = 8;
    var el = document.getElementById("countdown");
    var timer = setInterval(function () {
      seconds--;
      if (el) { el.textContent = seconds < 0 ? 0 : seconds; }
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(target);
      }
    }, 1000);
  })();
</script>
</body>
</html>
